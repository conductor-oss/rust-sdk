name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      oss_conductor_version:
        description: 'OSS Conductor image tag (falls back to E2E_TEST_OSS_CONDUCTOR_VERSION org var, then to a pinned default on fork PRs)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  license-headers:
    name: License Headers Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check license headers
        run: ./scripts/add-license-headers.sh --check

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run clippy (zero warnings enforced)
        run: |
          # Check library code with strict lints
          cargo clippy --lib --all-features -- -D warnings
          # Check tests and examples with relaxed lints (allow unwrap/expect in tests)
          cargo clippy --tests --examples --all-features -- -D warnings -A clippy::unwrap_used -A clippy::expect_used

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: cargo build --release --all-features
      
      - name: Build examples
        run: cargo build --examples --all-features

  test-unit:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run unit tests (library)
        run: cargo test --lib --all-features
      
      - name: Run doc tests
        run: cargo test --doc --all-features

  integration-tests-oss:
    name: Integration Tests (OSS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Used only when the org variable is unreachable because the run is a fork
      # PR -- see the resolve step below.
      FORK_PR_FALLBACK_VERSION: '3.32.3'

    steps:
      # OSS_CONDUCTOR_VERSION is resolved here rather than in the job `env` so
      # that the two ways it can come back empty get different treatment:
      #
      #   - Fork PR: GitHub withholds org/repo variables from pull_request runs
      #     on forks exactly as it withholds secrets, so vars.* is always "" for
      #     an outside contributor (observed in csharp-sdk#178). This job needs
      #     no secrets, only a tag, so pin one and keep running.
      #   - Anything else: the org variable is genuinely missing or its
      #     repository access policy no longer covers this repo. Fail loudly
      #     rather than silently drifting onto the pin.
      - name: Resolve OSS Conductor version
        env:
          REQUESTED_VERSION: ${{ inputs.oss_conductor_version || vars.E2E_TEST_OSS_CONDUCTOR_VERSION }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            resolved="$REQUESTED_VERSION"
          elif [ "$IS_FORK_PR" = "true" ]; then
            resolved="$FORK_PR_FALLBACK_VERSION"
            echo "::notice::Fork PR: org variables are withheld, pinning conductoross/conductor:${resolved}"
          else
            echo "::error::No Conductor OSS image tag resolved. Set the E2E_TEST_OSS_CONDUCTOR_VERSION organization variable (and ensure its repository access policy includes this repo), or pass the oss_conductor_version input via workflow_dispatch."
            exit 1
          fi
          echo "OSS_CONDUCTOR_VERSION=${resolved}" >> "$GITHUB_ENV"
          echo "Using conductoross/conductor:${resolved}"

      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Start Conductor OSS stack
        run: docker compose -f scripts/docker-compose-oss.yaml up -d

      - name: Wait for Conductor to be healthy
        # Matches HEALTH_TIMEOUT in scripts/run-integration-oss.sh, and stays under the compose
        # healthcheck's own ~200s budget. `curl -sf` alone is the check: /health answers non-2xx
        # while the server is still coming up, and grepping for the string "healthy" also matches
        # a `"healthy":false` body.
        run: timeout 180 bash -c 'until curl -sf http://localhost:8080/health; do sleep 5; done'

      - name: Run integration tests
        env:
          CONDUCTOR_SERVER_URL: http://localhost:8080/api
        # --nocapture so the `println!("Skipping: ...")` lines from the is_oss() gates land in the
        # job log. Without it cargo swallows stdout for passing tests, and "16 passed" is
        # indistinguishable from "16 skipped".
        run: cargo test --tests --all-features -- --test-threads=1 --nocapture

      - name: Dump Conductor logs
        if: failure()
        run: docker compose -f scripts/docker-compose-oss.yaml logs conductor-server

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run integration tests against Enterprise
        env:
          CONDUCTOR_SERVER_URL: ${{ vars.SDKDEV_SERVER_URL }}
          CONDUCTOR_AUTH_KEY: ${{ vars.SDKDEV_AUTH_KEY }}
          CONDUCTOR_AUTH_SECRET: ${{ secrets.SDKDEV_AUTH_SECRET }}
          # The shared dev instance is occasionally busy enough (concurrent
          # CI runs across SDKs, etc.) that the default 30s client timeout
          # has been observed to trip on plain requests (e.g. start_workflow).
          CONDUCTOR_TIMEOUT_SECS: "60"
        # --nocapture for the same reason as the OSS job: the is_oss() gates
        # print why they skipped, and against Enterprise a test that skips when
        # it should have asserted is the failure mode that matters most.
        run: cargo test --tests --all-features -- --test-threads=1 --nocapture

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build documentation
        run: cargo doc --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum Supported Rust Version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-msrv-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-msrv-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-msrv-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check MSRV compatibility
        run: cargo check --all-features
