name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  license-headers:
    name: License Headers Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check license headers
        run: ./scripts/add-license-headers.sh --check

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run clippy (zero warnings enforced)
        run: |
          # Check library code with strict lints
          cargo clippy --lib --all-features -- -D warnings
          # Check tests and examples with relaxed lints (allow unwrap/expect in tests)
          cargo clippy --tests --examples --all-features -- -D warnings -A clippy::unwrap_used -A clippy::expect_used

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: cargo build --release --all-features
      
      - name: Build examples
        run: cargo build --examples --all-features

  test-unit:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run unit tests (library)
        run: cargo test --lib --all-features
      
      - name: Run doc tests
        run: cargo test --doc --all-features

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      conductor:
        image: conductoross/conductor:latest
        ports:
          - 8080:8080
          - 5000:5000
        options: >-
          --health-cmd "curl -f http://localhost:8080/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Wait for Conductor to be ready
        run: |
          timeout 120 bash -c 'until curl -f -s http://localhost:8080/health | grep -q "healthy"; do 
            echo "Waiting for Conductor..."
            sleep 3
          done'
          echo "Conductor is ready!"
      
      - name: Verify Conductor is accessible
        run: |
          curl -v http://localhost:8080/health
          curl -v http://localhost:8080/api/metadata/workflow
      
      - name: Run integration tests
        env:
          CONDUCTOR_SERVER_URL: http://localhost:8080/api
        run: cargo test --tests --all-features -- --test-threads=1

  test-integration-enterprise:
    name: Integration Tests (Enterprise)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run integration tests against Enterprise
        env:
          CONDUCTOR_SERVER_URL: ${{ vars.SDKDEV_SERVER_URL }}
          CONDUCTOR_AUTH_KEY: ${{ vars.SDKDEV_AUTH_KEY }}
          CONDUCTOR_AUTH_SECRET: ${{ secrets.SDKDEV_AUTH_SECRET }}
        run: cargo test --tests --all-features -- --test-threads=1

  # Runs every sdk_playback_* example against a Conductor server in mock-LLM
  # playback mode, replaying the shared LLM recordings from
  # conductor-oss/conductor's llm-recordings/. Server startup, the HTTP/MCP
  # fixtures, and outcome validation all come from that repo's shared actions
  # (start-playback-services, start-playback, check-playback), so nothing about
  # the playback contract is duplicated here. check-playback reads persisted
  # workflow state: completed workflows pass, genuine guardrail rejections pass,
  # anything else fails the job. Rust compile errors and example process
  # failures (transport errors, panics) fail the job on their own steps.
  #
  # Use Conductor main for the shared actions and recordings.
  agents-playback:
    name: Agents Playback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CONDUCTOR_SERVER_URL: http://localhost:18080/api
      CONDUCTOR_AGENT_LLM_MODEL: mock/mockLLM
      GITHUB_REPOS_URL: http://localhost:3002/users/Conductor/repos?per_page=5&sort=updated
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: conductor-oss/conductor
          ref: main
          path: tmp/conductor

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      # Compile before the (slow) Conductor build so a Rust compile error fails fast.
      - name: Build agent examples
        run: |
          for file in examples/sdk_playback_*.rs; do
            example=$(basename "$file" .rs)
            cargo build --all-features --example "$example"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Conductor
        working-directory: tmp/conductor
        run: ./gradlew --no-daemon :conductor-server:bootJar -x test

      - name: Start HTTP and MCP fixtures
        uses: ./tmp/conductor/.github/actions/start-playback-services

      - name: Start Conductor
        id: server
        uses: ./tmp/conductor/.github/actions/start-playback

      # Each example deploys its agent, starts and polls its own tool workers,
      # answers its own approval prompts (09, 09c), and blocks until the
      # execution reaches a terminal state, so the run below is complete once
      # the process exits. A non-zero exit (transport error, panic, missing
      # server) fails this step; the workflow outcome itself is judged by
      # check-playback from persisted task data, never by anything here.
      - name: Run agent examples
        run: |
          mkdir -p tmp/agent-playback
          status=0
          for file in examples/sdk_playback_*.rs; do
            example=$(basename "$file" .rs)
            echo "::group::$example"
            if ! cargo run --all-features --example "$example" 2>&1 | tee "tmp/agent-playback/$example.log"; then
              echo "::error::$example exited with a failure"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Validate playback
        if: always() && steps.server.outcome == 'success'
        uses: ./tmp/conductor/.github/actions/check-playback
        with:
          server-url: http://localhost:18080/api

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agents-playback-logs
          path: tmp/agent-playback/*.log

      - name: Stop services
        if: always()
        run: |
          for file in tmp/agent-playback/*.pid; do
            [ -f "$file" ] && kill "$(cat "$file")" 2>/dev/null || true
          done

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build documentation
        run: cargo doc --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum Supported Rust Version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-msrv-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-msrv-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-msrv-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check MSRV compatibility
        run: cargo check --all-features
