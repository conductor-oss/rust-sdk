name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  license-headers:
    name: License Headers Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check license headers
        run: ./scripts/add-license-headers.sh --check

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run clippy (zero warnings enforced)
        run: |
          # Check library code with strict lints
          cargo clippy --lib --all-features -- -D warnings
          # Check tests and examples with relaxed lints (allow unwrap/expect in tests)
          cargo clippy --tests --examples --all-features -- -D warnings -A clippy::unwrap_used -A clippy::expect_used

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: cargo build --release --all-features
      
      - name: Build examples
        run: cargo build --examples --all-features

  test-unit:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run unit tests (library)
        run: cargo test --lib --all-features
      
      - name: Run doc tests
        run: cargo test --doc --all-features

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      conductor:
        image: conductoross/conductor:latest
        ports:
          - 8080:8080
          - 5000:5000
        options: >-
          --health-cmd "curl -f http://localhost:8080/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Wait for Conductor to be ready
        run: |
          timeout 120 bash -c 'until curl -f -s http://localhost:8080/health | grep -q "healthy"; do 
            echo "Waiting for Conductor..."
            sleep 3
          done'
          echo "Conductor is ready!"
      
      - name: Verify Conductor is accessible
        run: |
          curl -v http://localhost:8080/health
          curl -v http://localhost:8080/api/metadata/workflow
      
      - name: Run integration tests
        env:
          CONDUCTOR_SERVER_URL: http://localhost:8080/api
        run: cargo test --tests --all-features -- --test-threads=1

  test-integration-enterprise:
    name: Integration Tests (Enterprise)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run integration tests against Enterprise
        env:
          CONDUCTOR_SERVER_URL: ${{ vars.SDKDEV_SERVER_URL }}
          CONDUCTOR_AUTH_KEY: ${{ vars.SDKDEV_AUTH_KEY }}
          CONDUCTOR_AUTH_SECRET: ${{ secrets.SDKDEV_AUTH_SECRET }}
        run: cargo test --tests --all-features -- --test-threads=1

  # Runs the sdk_playback_* examples against a Conductor server in mock-LLM
  # playback mode, replaying the shared LLM recordings from
  # https://github.com/conductor-oss/conductor/pull/1614 and verifying every
  # recording was actually exercised, byte-for-byte, via that PR's
  # check-playback action.
  #
  # conductor-oss/conductor#1614 is not merged yet, so this checks out its
  # branch at a pinned commit rather than a release tag — bump PLAYBACK_SERVER_REF
  # to a release once the PR lands, and drop this comment.
  #
  # Known gap, not a rust-sdk regression: `04_http_and_mcp_tools` and one
  # recording in `16e_credentials_http_tool` fail LLM-request matching
  # because the `mcp-testkit` test-tool server's tool definitions have
  # drifted from what they were when these recordings were captured
  # (neither this SDK nor python-sdk's own agent-e2e.yml pin a mcp-testkit
  # version). Non-blocking (continue-on-error) until that's resolved
  # upstream — see the recordings-verification step below.
  test-playback:
    name: LLM Playback Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYBACK_SERVER_REF: acb7d27750e5dacc6a6334ed0bcabe3ade030533 # conductor-oss/conductor@feature/llm_mock_impl, see comment above
      CONDUCTOR_SERVER_URL: http://localhost:8080/api
      # mcp-testkit doesn't validate these values; conductor-server just needs
      # something to resolve for the credentialed-tool scenarios' declared
      # credential names (HTTP_TEST_API_KEY / MCP_TEST_API_KEY).
      CONDUCTOR_SECRET_HTTP_TEST_API_KEY: e2e-http-test-secret-key-67890
      CONDUCTOR_SECRET_MCP_TEST_API_KEY: e2e-test-secret-key-12345
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Conductor server (LLM recording/playback branch)
        uses: actions/checkout@v4
        with:
          repository: conductor-oss/conductor
          ref: ${{ env.PLAYBACK_SERVER_REF }}
          path: conductor-server

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Python (for mcp-testkit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-playback-${{ hashFiles('conductor-server/**/*.gradle*', 'conductor-server/**/gradle-wrapper.properties') }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Conductor server (skip tests/UI, boot JAR only)
        working-directory: conductor-server
        run: ./gradlew build -x test -x spotlessCheck -x shadowJar --no-daemon -Dorg.gradle.jvmargs=-Xmx3g

      - name: Start mcp-testkit (deterministic HTTP + MCP test tools on :3001)
        run: |
          pip install --quiet mcp-testkit 'mcp<2'
          mcp-testkit --transport http --port 3001 &
          for i in $(seq 1 15); do
            if curl -s -o /dev/null http://localhost:3001/mcp; then
              echo "mcp-testkit ready after ~${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::mcp-testkit failed to start on port 3001"
          exit 1

      - name: Start Conductor server in mock-LLM playback mode
        working-directory: conductor-server
        run: |
          cat > mock-playback.properties <<EOF
          conductor.integrations.ai.enabled=true
          conductor.ai.record-mode=false
          conductor.ai.enable-llm-mocks=true
          conductor.ai.recordings-directory=${{ github.workspace }}/conductor-server/llm-recordings
          EOF
          java -Xmx2g -DCONDUCTOR_CONFIG_FILE="$PWD/mock-playback.properties" \
            -jar server/build/libs/*boot*.jar > ../server.log 2>&1 &

      - name: Wait for server health
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/health | grep -q '"healthy"[[:space:]]*:[[:space:]]*true'; then
              echo "server healthy after ~$((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::server did not become healthy"
          cat server.log
          exit 1

      - name: Run SDK playback scenarios
        continue-on-error: true # see known-gap comment on the job above
        run: |
          scenarios=(
            sdk_playback_01_basic_agent
            sdk_playback_02a_simple_tools
            sdk_playback_02c_tool_retry_config
            sdk_playback_04_http_and_mcp_tools
            sdk_playback_05_handoffs
            sdk_playback_06_sequential_pipeline
            sdk_playback_07_parallel_agents
            sdk_playback_09_human_in_the_loop
            sdk_playback_09c_hitl_streaming
            sdk_playback_103_plan_and_compile
            sdk_playback_10_guardrails
            sdk_playback_13_hierarchical_agents
            sdk_playback_16e_credentials_http_tool
            sdk_playback_17_swarm_orchestration
            sdk_playback_21_regex_guardrails
            sdk_playback_22_llm_guardrails
            sdk_playback_33_external_workers
            sdk_playback_64_swarm_with_tools
            sdk_playback_66_handoff_to_parallel
          )
          # sdk_playback_16f_credentials_mcp_tool has no recording in
          # conductor-oss/conductor#1614 yet, so it's intentionally excluded here.
          status=0
          for scenario in "${scenarios[@]}"; do
            echo "=== $scenario ==="
            cargo run --example "$scenario" --all-features || status=1
          done
          exit $status

      - name: Verify recordings were played back
        if: always()
        continue-on-error: true # see known-gap comment on the job above
        uses: ./conductor-server/.github/actions/check-playback
        with:
          server-url: ${{ env.CONDUCTOR_SERVER_URL }}

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-server-log
          path: server.log
          retention-days: 14

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build documentation
        run: cargo doc --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum Supported Rust Version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-msrv-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-msrv-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-msrv-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check MSRV compatibility
        run: cargo check --all-features
