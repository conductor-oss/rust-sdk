[package]
name = "harness"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
conductor = { path = "..", package = "conductor-rust" }
tokio = { version = "1.35", features = ["full", "macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0"
rand = "0.8"
hostname = "0.3"
uuid = { version = "1.6", features = ["v4"] }
async-trait = "0.1"
