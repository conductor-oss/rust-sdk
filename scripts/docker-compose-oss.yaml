# Conductor OSS stack used to run the SDK integration tests against open-source
# Conductor. Shared by scripts/run-integration-oss.sh and the
# integration-tests-oss job in .github/workflows/ci.yml.
#
# The `image:` default below is the SINGLE place this repo writes the Conductor
# OSS image tag. Everything that does not override OSS_CONDUCTOR_VERSION lands
# on it: a plain scripts/run-integration-oss.sh run, and the
# integration-tests-oss job on a fork PR (where GitHub withholds org variables).
# Overrides are the script's --version flag and, in CI, the
# E2E_TEST_OSS_CONDUCTOR_VERSION org variable or a workflow_dispatch input.
#
# That org variable is currently set to `latest`, so a normal CI run is not
# really pinned today -- it tracks whatever `latest` resolves to at run time,
# and an upstream image push can turn a green PR red on its own. The point of
# the variable is that it's a single org-wide lever: set it to a fixed tag and
# every OSS SDK repo moves to that version at once, from one place. Until then
# the default below is what actually pins fork PRs and local runs, and it is
# per-repo -- bumping the floor everywhere means editing each repo's compose
# file, or pulling the lever.
#
# Per-repo project name; unnamed, the project defaults to this file's directory
# (`scripts`) in every SDK repo and the stacks collide on a dev machine that has
# more than one of them checked out.
name: rust-sdk-oss-e2e
services:
  conductor-server:
    image: conductoross/conductor:${OSS_CONDUCTOR_VERSION:-3.32.3}
    environment:
      - CONFIG_PROP=config-postgres.properties
      # Dummy, non-sensitive value so OSS's bundled env-backed SecretsDAO has
      # something real to read back in tests/orkes_client_tests.rs (get/list/
      # exists). OSS Conductor has no authentication at all, so an
      # unauthenticated /api/secrets/{key} read doesn't change the threat
      # model versus any other unauthenticated OSS endpoint -- don't put a
      # real credential here.
      - CONDUCTOR_SECRET_RUST_SDK_INTEGRATION_TEST=rust-sdk-oss-secret-value
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-I", "-XGET", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 20
    links:
      - conductor-postgres:postgresdb
    depends_on:
      conductor-postgres:
        condition: service_healthy
  conductor-postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=conductor
      - POSTGRES_PASSWORD=conductor
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/5432'
      interval: 5s
      timeout: 5s
      retries: 12
