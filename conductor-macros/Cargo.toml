[package]
name = "conductor-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Procedural macros for Conductor Rust SDK"
license = "Apache-2.0"
repository = "https://github.com/conductor-oss/conductor-rust"
homepage = "https://conductor-oss.org"
documentation = "https://docs.rs/conductor-macros"
authors = ["Orkes, Inc. <info@orkes.io>"]
keywords = ["conductor", "workflow", "macros", "procedural-macros"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
darling = "0.20"
