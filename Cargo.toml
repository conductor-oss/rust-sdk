[package]
name = "conductor-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rust SDK for Netflix Conductor workflow orchestration"
license = "Apache-2.0"
repository = "https://github.com/conductor-oss/rust-sdk"
homepage = "https://conductor-oss.org"
documentation = "https://docs.rs/conductor-sdk"
authors = ["Orkes, Inc. <info@orkes.io>"]
keywords = ["conductor", "workflow", "orchestration", "microservices"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"
exclude = [
    ".github/*",
    ".gitignore",
    "PUBLISHING.md",
    "DESIGN.md",
    "SDK_COMPARISON.md",
    "WORKER_COMPARISON.md",
    "EXAMPLES_COMPARISON.md",
    "launch_blog.md",
]

# Lint configuration for production-ready code
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Critical: Prevent panics in production
unwrap_used = "warn"
expect_used = "warn"
# Performance
redundant_clone = "warn"
needless_borrow = "warn"
# Code quality
large_enum_variant = "warn"
clone_on_copy = "warn"

[workspace]
members = [".", "conductor-macros", "harness"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "macros", "rt-multi-thread", "sync", "time"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
hyper = { version = "0.14", features = ["server", "http1", "http2", "tcp"] }
urlencoding = "2.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Metrics
prometheus = "0.13"

# Utilities
async-trait = "0.1"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.3"
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "5.5"
futures = "0.3"

# Environment/Config
dotenvy = "0.15"

# Derive macros for worker functions
inventory = "0.3"

# JSON Schema generation
schemars = "0.8"

# Procedural macros (optional feature)
conductor-macros = { version = "0.1.0", path = "conductor-macros", optional = true }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.5"
mockall = "0.12"
criterion = "0.5"

[features]
default = []
macros = ["conductor-macros"]

